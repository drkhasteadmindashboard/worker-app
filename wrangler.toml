name = "doctor-khaste-dashboard"
main = "src/index.js"
compatibility_date = "2024-09-23"

# --- فایل‌های استاتیک داشبورد (HTML/CSS/JS) ---
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# --- دیتابیس رایگان D1 ---
# بعد از اجرای: wrangler d1 create doctor_khaste_db
# مقدار database_id را از خروجی همان دستور اینجا جایگزین کن
[[d1_databases]]
binding = "DB"
database_name = "doctor_khaste_db"
database_id = "f85f19b1-49d3-49cd-bcc2-93a3b1ffd0a3"

# --- زمان‌بندی خودکار (کرون رایگان) ---
# هر ۳۰ دقیقه: بررسی و اطلاع‌رسانی موعد تسک‌ها در تلگرام
# هر روز ساعت ۰۲:۰۰ UTC: بکاپ خودکار به گیت‌هاب
[triggers]
crons = ["*/30 * * * *", "0 2 * * *"]

# --- متغیرهای عمومی (غیر محرمانه) ---
[vars]
GITHUB_REPO = "drkhasteadmindashboard/worker-backup"
GITHUB_BRANCH = "main"
GITHUB_BACKUP_DIR = "backups"
GITHUB_FILES_DIR = "files"

# --- مقادیر محرمانه (با wrangler secret put تنظیم شوند، نه اینجا) ---
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# GITHUB_TOKEN
